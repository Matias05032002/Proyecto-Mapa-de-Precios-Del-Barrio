<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <form action="/spring/producto/buscar" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="nombre" class="form-control form-control-lg"
                   placeholder="Buscá un producto...">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>
    <h2>Productos disponibles</h2>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Marca</th>
            <th>Unidad</th>
            <th>Precio</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="producto : ${productos}">
            <td th:text="${producto.nombre}"></td>
            <td th:text="${producto.categoria}"></td>
            <td th:text="${producto.marca}"></td>
            <td th:text="${producto.unidad}"></td>
            <td th:text="${producto.precio}"></td>
            <th>ID</th>
            <td th:text="${producto.id}"></td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-5">Agregar producto</h4>
    <form action="/spring/producto" method="post">
        <div class="mb-3">
            <input type="text" name="nombre" class="form-control" placeholder="Nombre">
        </div>
        <div class="mb-3">
            <input type="text" name="categoria" class="form-control" placeholder="Categoría">
        </div>
        <div class="mb-3">
            <input type="text" name="marca" class="form-control" placeholder="Marca">
        </div>
        <div class="mb-3">
            <input type="text" name="unidad" class="form-control" placeholder="Unidad (ej: 900ml)">
        </div>
        <div class="mb-3">
            <input type="number" name="precio" class="form-control" placeholder="Precio">
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
