<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comercios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2>Comercios del barrio</h2>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Localidad</th>
            <th>Dirección</th>
            <th>Tipo</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="comercio : ${comercios}">
            <td th:text="${comercio.nombre}"></td>
            <td th:text="${comercio.localidad}"></td>
            <td th:text="${comercio.direccion}"></td>
            <td th:text="${comercio.tipo}"></td>
            <th>ID</th>

            <td th:text="${comercio.id}"></td>
            <td>
                <a th:href="@{/spring/comercios/{id}(id=${comercio.id})}"
                   class="btn btn-sm btn-outline-primary">
                    Ver productos
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-5">Agregar comercio</h4>
    <form action="/spring/comercio" method="post" class="mt-3">
        <div class="mb-3">
            <input type="text" name="nombre" class="form-control" placeholder="Nombre">
        </div>
        <div class="mb-3">
            <input type="text" name="localidad" class="form-control" placeholder="Localidad">
        </div>
        <div class="mb-3">
            <input type="text" name="direccion" class="form-control" placeholder="Dirección">
        </div>
        <div class="mb-3">
            <input type="text" name="descripcion" class="form-control" placeholder="Descripción">
        </div>
        <div class="mb-3">
            <input type="text" name="tipo" class="form-control" placeholder="Tipo (ej: Almacén, Verdulería)">
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
