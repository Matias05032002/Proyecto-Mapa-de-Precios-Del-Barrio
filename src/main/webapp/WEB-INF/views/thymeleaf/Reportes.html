<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes de precios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">

    <h2>Reportes de precios</h2>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Producto</th>
            <th>Comercio</th>
            <th>Precio</th>
            <th>Fecha</th>
            <th>Puntuación</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reporte : ${reportes}">
            <td th:text="${reporte.producto.nombre}"></td>
            <td th:text="${reporte.comercio.nombre}"></td>
            <td th:text="${reporte.precio}"></td>
            <td th:text="${#temporals.format(reporte.fechaDeReporte, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${reporte.puntuacion}"></td>
            <td>
                <form th:action="@{/spring/reporte/{id}/dudoso(id=${reporte.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Marcar dudoso</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-5">Cargar precio</h4>
    <form action="/spring/reporte" method="post" class="mt-3">

        <h6 class="text-muted mt-3">Datos del producto</h6>
        <div class="mb-3">
            <input type="text" name="producto.nombre" class="form-control" placeholder="Nombre del producto">
        </div>
        <div class="mb-3">
            <input type="text" name="producto.marca" class="form-control" placeholder="Marca">
        </div>
        <div class="mb-3">
            <input type="text" name="producto.categoria" class="form-control" placeholder="Categoría">
        </div>
        <div class="mb-3">
            <input type="text" name="producto.unidad" class="form-control" placeholder="Unidad (ej: 1kg, 900ml)">
        </div>

        <h6 class="text-muted mt-3">Datos del comercio</h6>
        <div class="mb-3">
            <input type="text" name="comercio.nombre" class="form-control" placeholder="Nombre del comercio">
        </div>
        <div class="mb-3">
            <input type="text" name="comercio.direccion" class="form-control" placeholder="Dirección">
        </div>
        <div class="mb-3">
            <input type="text" name="comercio.localidad" class="form-control" placeholder="Localidad">
        </div>

        <h6 class="text-muted mt-3">Precio</h6>
        <div class="mb-3">
            <input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio">
        </div>

        <button type="submit" class="btn btn-primary">Guardar reporte</button>
    </form>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
