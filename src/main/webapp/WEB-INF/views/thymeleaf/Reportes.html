<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes de precios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2>Reportes de precios</h2>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Producto</th>
            <th>Comercio</th>
            <th>Precio</th>
            <th>Fecha</th>
            <th>Vigente</th>
            <th>Puntuación</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reporte : ${reportes}">
            <td th:text="${reporte.producto.nombre}"></td>
            <td th:text="${reporte.comercio.nombre}"></td>
            <td th:text="${reporte.precio}"></td>
            <td th:text="${reporte.fechaDeReporte}"></td>
            <td th:text="${reporte.vigente}"></td>
            <td th:text="${reporte.puntuacion}"></td>
            <td>
                <form th:action="@{/spring/reporte/{id}/dudoso(id=${reporte.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        Marcar dudoso
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-5">Cargar precio</h4>
    <form action="/spring/reporte" method="post" class="mt-3">
        <div class="mb-3">
            <label>Producto</label>
            <select name="producto.id" class="form-control">
                <option value="">Seleccioná un producto</option>
                <option th:each="producto : ${productos}"
                        th:value="${producto.id}"
                        th:text="${producto.nombre}">
                </option>
            </select>
        </div>
        <div class="mb-3">
            <label>Comercio</label>
            <select name="comercio.id" class="form-control">
                <option value="">Seleccioná un comercio</option>
                <option th:each="comercio : ${comercios}"
                        th:value="${comercio.id}"
                        th:text="${comercio.nombre}">
                </option>
            </select>
        </div>
        <div class="mb-3">
            <label>Precio</label>
            <input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio">
        </div>
        <button type="submit" class="btn btn-primary">Guardar reporte</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
